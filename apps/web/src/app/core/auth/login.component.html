<main class="auth-page">
  <section class="auth-card" aria-labelledby="auth-heading">
    <a class="back" routerLink="/">← Back to scanner</a>
    <p class="eyebrow">OPTIONAL ACCOUNT</p>
    <h1 id="auth-heading">{{ registerMode() ? 'Create your account' : 'Sign in' }}</h1>
    <p class="intro">Save your workspace and prepare for future premium features.</p>
    <div class="social-actions">
      <button type="button" class="social-button" (click)="signInWithGoogle()" [disabled]="busy()">
        <span class="google-icon" aria-hidden="true">G</span>
        Continue with Google
      </button>
    </div>
    <div class="divider"><span>or use email</span></div>
    <form (ngSubmit)="submitEmail()">
      <label for="email">Email address</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        required
        [(ngModel)]="email"
      />
      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        minlength="6"
        required
        [(ngModel)]="password"
      />
      <button type="submit" class="primary" [disabled]="busy()">
        {{ registerMode() ? 'Create account' : 'Sign in with email' }}
      </button>
    </form>
    <button type="button" class="mode" (click)="toggleMode()">
      {{ registerMode() ? 'Already have an account? Sign in' : 'New here? Create an account' }}
    </button>
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    @if (busy()) {
      <p class="busy" role="status">Opening secure sign-in…</p>
    }
    <p class="privacy">Scanning remains free without an account.</p>
  </section>
</main>
