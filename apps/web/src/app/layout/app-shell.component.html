<div class="shell">
  <header class="topbar">
    <a class="brand" data-brand routerLink="/" aria-label="SuperScanner home">
      <span class="brand__mark" aria-hidden="true"><span></span></span>
      <span class="brand__name">SuperScanner</span>
    </a>

    <nav aria-label="Primary">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        aria-label="Home"
      >
        <span class="nav-icon" aria-hidden="true">⌂</span>
        <span class="nav-label">Home</span>
      </a>
      <a routerLink="/scan" routerLinkActive="active" aria-label="Scan">
        <span class="nav-icon nav-icon--scan" aria-hidden="true">＋</span>
        <span class="nav-label">Scan</span>
      </a>
      <a routerLink="/edit" routerLinkActive="active" aria-label="Edit">
        <span class="nav-icon" aria-hidden="true">✎</span>
        <span class="nav-label">Edit</span>
      </a>
      <a routerLink="/export" routerLinkActive="active" aria-label="Export">
        <span class="nav-icon" aria-hidden="true">⇧</span>
        <span class="nav-label">Export</span>
      </a>
    </nav>

    <div class="topbar__actions">
      <span class="private-state"><span aria-hidden="true">●</span> Private</span>
      <button type="button" class="account" aria-label="Open account menu">TY</button>
    </div>
  </header>

  <main id="main-content">
    <router-outlet />
  </main>
</div>
