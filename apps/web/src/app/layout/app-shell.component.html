<div class="shell">
  <header class="topbar">
    <a class="brand" data-brand routerLink="/" aria-label="SuperScanner home">
      <span class="brand__mark" aria-hidden="true"><span></span></span>
      <span class="brand__name">SuperScanner</span>
    </a>

    <nav aria-label="Primary">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        aria-label="Scan"
      >
        <span class="nav-icon nav-icon--scan" aria-hidden="true">＋</span>
        <span class="nav-label">Scan</span>
      </a>
      <a routerLink="/documents" routerLinkActive="active" aria-label="My documents">
        <span class="nav-icon" aria-hidden="true">▤</span>
        <span class="nav-label">My documents</span>
      </a>
    </nav>

    <div class="topbar__actions">
      <span class="private-state"><span aria-hidden="true">●</span> Private</span>
      <div class="account-wrap">
        @if ((auth.user$ | async)?.isAnonymous) {
          <a class="sign-in" routerLink="/login">Sign in</a>
        } @else {
          <button
            type="button"
            class="account"
            aria-label="Open account menu"
            (click)="menuOpen.update((value) => !value)"
          >
            {{ (auth.user$ | async)?.email?.slice(0, 2)?.toUpperCase() || 'ME' }}
          </button>
          @if (menuOpen()) {
            <div class="account-menu">
              <span>{{ (auth.user$ | async)?.email }}</span>
              <button type="button" data-sign-out (click)="signOut()">Sign out</button>
            </div>
          }
        }
      </div>
    </div>
  </header>

  <main id="main-content">
    <router-outlet />
  </main>
</div>
